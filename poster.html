<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゆず香ステラ ポスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ============================================================
   ゆず香ステラ ポスター

   ■ 印刷のしかた
     このファイルをブラウザで開き、⌘P（Windows は Ctrl+P）→
     「PDFとして保存」。余白は「なし」、背景のグラフィックは「あり」にする。

   ■ 直すところ
     ・用紙の大きさ … すぐ下の --paper（A4 と A3 を用意してある）
     ・文字         … <body> の中。ふつうの文章なので直接書き換えられる
     ・色           … :root の色の名前
     ・絵           … art/ の中の画像。差し替えればそのまま出る

   ■ 注意
     art/ の画像を参照しているので、このファイルは必ずプロジェクトの
     直下（index.html と同じ場所）に置いたまま開くこと。
     場所を移すと絵が出ない。
   ============================================================ */

/* ---- 用紙。A3 にするなら下の 2 行を入れ替える ---- */
:root{ --paper-w:210mm; --paper-h:297mm; }        /* A4 たて */
/* :root{ --paper-w:297mm; --paper-h:420mm; } */  /* A3 たて */

:root{
  --cream:#FDF8EA;
  --card:#FFFBF0;
  --lift:#FAF3E0;
  --brown:#4A3621;
  --brown-soft:#6E5A42;
  --gold:#C9A227;
  --gold-line:#E6D7A8;
  --wood:#7C5B3C;
  --choco:#4A2E1E;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',YuMincho,serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}

@page{ size:var(--paper-w) var(--paper-h); margin:0; }
html,body{margin:0;padding:0}
body{
  background:#8a8a8a;              /* 画面で見るときの台紙。印刷には出ない */
  font-family:var(--sans);color:var(--brown-soft);
  -webkit-font-smoothing:antialiased;
}

/* 1 枚の紙。画面では中央に置き、印刷では紙そのものになる。 */
.sheet{
  width:var(--paper-w);height:var(--paper-h);
  margin:24px auto;position:relative;overflow:hidden;
  background:var(--cream);
  display:flex;flex-direction:column;
  padding:18mm 16mm 14mm;
  box-shadow:0 8px 40px rgba(0,0,0,.35);
}
@media print{
  body{background:#fff}
  .sheet{margin:0;box-shadow:none}
  /* 地色と水彩を紙に出す。これが無いと背景が全部白で刷られる。 */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---- 四隅の水彩。紙の端まで出す ---- */
.deco{position:absolute;pointer-events:none;z-index:0;opacity:.95}
.deco-tl{top:0;left:0;width:46mm}
.deco-tr{top:0;right:0;width:38mm}
.deco-bl{bottom:0;left:0;width:38mm}
.deco-br{bottom:0;right:0;width:40mm}

.inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* ---- 表札 ---- */
.head{text-align:center;flex:none}
.brand{
  font-family:var(--serif);font-weight:600;color:var(--brown);
  font-size:20mm;letter-spacing:.14em;line-height:1.1;margin:0;
}
.romaji{
  font-family:var(--serif);color:var(--gold);
  font-size:4.2mm;letter-spacing:.42em;margin:4mm 0 0;
}
.rule{display:flex;align-items:center;justify-content:center;gap:5mm;margin:6mm 0 0}
.rule::before,.rule::after{content:"";height:1px;background:var(--gold-line);flex:1;max-width:48mm}
.rule img{width:9mm}

/* ---- 商品 ---- */
.items{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin:10mm 0 0}
.item{
  border-radius:6mm;padding:8mm 6mm 7mm;text-align:center;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:3mm;
}
.item--yuzu {background:var(--wood)}
.item--choco{background:var(--choco)}
.item img{width:34mm;height:auto}
.item-name{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
.item-flavor{display:block;font-size:12mm;letter-spacing:.08em}
.item-kind{display:block;font-size:5mm;letter-spacing:.2em;opacity:.9;margin-top:1.5mm}
.item-price{font-family:var(--serif);font-size:11mm;margin:1mm 0 0;letter-spacing:.03em}
.item-price small{font-size:.45em;margin-left:.5mm}
.item-per{font-size:3.8mm;letter-spacing:.08em;opacity:.88;margin:0}

/* ---- ご注文の流れ ---- */
.flow{flex:1;min-height:0;margin:10mm 0 0;display:flex;flex-direction:column;justify-content:center}
.sec-title{
  font-family:var(--serif);font-weight:600;color:var(--brown);
  font-size:7mm;letter-spacing:.2em;text-align:center;margin:0 0 7mm;
}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin:0;padding:0;list-style:none}
.step{
  background:var(--card);border:1px solid var(--gold-line);border-radius:4mm;
  padding:5mm 3mm;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2.5mm;
}
.step-no{
  width:8mm;height:8mm;border-radius:50%;background:var(--brown);color:var(--lift);
  font-family:var(--serif);font-size:4.4mm;display:grid;place-items:center;flex:none;
}
.step svg{width:13mm;height:13mm;color:var(--brown)}
.step-text{font-size:3.7mm;line-height:1.6;color:var(--brown);letter-spacing:.04em}

/* ---- アレルギー ---- */
.allergy{
  flex:none;margin:9mm 0 0;padding:5mm 6mm;border-radius:4mm;
  background:var(--lift);border:1px solid var(--gold-line);
  display:flex;align-items:center;gap:5mm;
}
.allergy-h{
  font-family:var(--serif);color:var(--brown);font-size:4.6mm;letter-spacing:.14em;
  white-space:nowrap;margin:0;flex:none;
}
.allergy-list{display:flex;gap:5mm;flex:none}
.allergy-one{display:flex;align-items:center;gap:1.8mm}
.allergy-one svg{width:7mm;height:7mm;color:var(--brown)}
.allergy-one span{font-size:4mm;color:var(--brown)}
.allergy-note{font-size:3.1mm;line-height:1.6;color:var(--brown-soft);margin:0}

/* ---- 足もと ---- */
.foot{flex:none;text-align:center;margin:6mm 0 0;font-size:3.4mm;letter-spacing:.14em;color:var(--brown-soft)}
</style>
</head>

<body>
<div class="sheet">
  <img class="deco deco-tl" src="art/tl.png" alt="">
  <img class="deco deco-tr" src="art/tr.png" alt="">
  <img class="deco deco-bl" src="art/bl.png" alt="">
  <img class="deco deco-br" src="art/br.png" alt="">

  <div class="inner">

    <!-- ===== 表札 ===== -->
    <header class="head">
      <h1 class="brand">ゆず香ステラ</h1>
      <p class="romaji">YUZUKA STELLA</p>
      <div class="rule"><img src="art/divider-yuzu.png" alt=""></div>
    </header>

    <!-- ===== 商品 ===== -->
    <section class="items">
      <article class="item item--yuzu">
        <img src="art/mark-yuzu.png" alt="">
        <h2 class="item-name">
          <span class="item-flavor">ゆず</span>
          <span class="item-kind">カステラ</span>
        </h2>
        <p class="item-price">250<small>円</small></p>
        <p class="item-per">1カップ（6個入り）</p>
      </article>

      <article class="item item--choco">
        <img src="art/mark-cacao.png" alt="">
        <h2 class="item-name">
          <span class="item-flavor">チョコ</span>
          <span class="item-kind">カステラ</span>
        </h2>
        <p class="item-price">250<small>円</small></p>
        <p class="item-per">1カップ（6個入り）</p>
      </article>
    </section>

    <!-- ===== ご注文の流れ ===== -->
    <section class="flow">
      <h2 class="sec-title">ご注文の流れ</h2>
      <ol class="steps">

        <li class="step">
          <span class="step-no">1</span>
          <!-- 画面を選ぶ -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="7" width="32" height="26" rx="3"/>
            <path d="M18 40h12M24 33v7"/>
            <path d="M15 15h8M15 22h14"/>
          </svg>
          <span class="step-text">受付機で<br>商品を選ぶ</span>
        </li>

        <li class="step">
          <span class="step-no">2</span>
          <!-- 札を取る -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="19" y="5" width="18" height="23" rx="4"/>
            <circle cx="28" cy="11" r="1.6"/>
            <path d="M8 31h20v8a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z"/>
            <path d="M8 31l4-4h20l-4 4z" opacity=".55"/>
            <path d="M13 27v-6M20 27v-4"/>
          </svg>
          <span class="step-text">番号札を<br>1枚取る</span>
        </li>

        <li class="step">
          <span class="step-no">3</span>
          <!-- 会計 -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 38h38"/>
            <path d="M11 38V18a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v20"/>
            <path d="M16 21h8M16 28h5"/>
            <circle cx="37" cy="26" r="7"/>
            <path d="M34 22l3 4 3-4M37 26v5M34 28h6"/>
          </svg>
          <span class="step-text">会計口で<br>お支払い</span>
        </li>

        <li class="step">
          <span class="step-no">4</span>
          <!-- 呼ばれて受け取る -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 7a9 9 0 0 1 9 9v8l3 5H12l3-5v-8a9 9 0 0 1 9-9z"/>
            <path d="M21 34a3 3 0 0 0 6 0"/>
            <path d="M24 7V4"/>
            <path d="M38 14c2 2 3 5 3 8M10 14c-2 2-3 5-3 8" opacity=".5"/>
          </svg>
          <span class="step-text">番号が呼ばれたら<br>お受け取り</span>
        </li>

      </ol>
    </section>

    <!-- ===== アレルギー ===== -->
    <section class="allergy">
      <p class="allergy-h">アレルギー</p>
      <div class="allergy-list">
        <span class="allergy-one">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 44V20"/>
            <path d="M24 20c0-5-4-8.5-8-9.5.5 5.5 3 9 8 9.5zM24 20c0-5 4-8.5 8-9.5-.5 5.5-3 9-8 9.5z"/>
            <path d="M24 32c0-5-4-8.5-8-9.5.5 5.5 3 9 8 9.5zM24 32c0-5 4-8.5 8-9.5-.5 5.5-3 9-8 9.5z"/>
          </svg><span>小麦粉</span>
        </span>
        <span class="allergy-one">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 6c7.5 0 13 11.5 13 20a13 13 0 0 1-26 0C11 17.5 16.5 6 24 6z"/>
          </svg><span>卵</span>
        </span>
        <span class="allergy-one">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 5h10v8l4.5 7V40a3 3 0 0 1-3 3h-13a3 3 0 0 1-3-3V20l4.5-7z"/>
            <path d="M14.5 27h19M19 13h10"/>
          </svg><span>牛乳</span>
        </span>
      </div>
      <p class="allergy-note">
        すべて同じ調理場・同じ器具で作っています。<br>
        表示のない原材料が微量に混入する可能性を、完全には防げません。
      </p>
    </section>

    <p class="foot">やさしい甘さ、香るゆず</p>

  </div>
</div>
</body>
</html>
