name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に 1 本だけ。進行中のものはキャンセルせず終わらせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: ドメインロジックのテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./internal/...
          GOOS=js GOARCH=wasm go vet .

      - name: go test
        run: go test -race ./internal/...

      # index.html が呼ぶとおりに main.wasm を叩き、JS との契約を検証する。
      # Go 側のテストだけでは syscall/js の受け渡しまでは確認できない。
      - name: WASM ビルド & 契約テスト
        run: |
          GOOS=js GOARCH=wasm go build -o main.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .
          node test/wasm_contract_test.mjs
          node test/wasm_ready_guard_test.mjs
          node test/tag_contract_test.mjs
          # 画面側のロジック（在庫・札・営業回）と、Go との二重実装のずれ。
          node test/pure_logic_test.mjs
          node test/pure_parity_test.mjs
          # $('id') の打ち間違いは実行時まで気づけない。静的に照合する。
          node test/dom_wiring_test.mjs

  build:
    name: 配信物のビルド
    needs: test
    runs-on: ubuntu-latest
    # render ブランチへ配信物を押すので、この job だけ contents に書き込む。
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: WASM をビルド
        run: |
          GOOS=js GOARCH=wasm go build \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o main.wasm .
          ls -lh main.wasm

      - name: wasm_exec.js をコピー
        # Go 1.24 で misc/wasm から lib/wasm へ移動した。両方を見る。
        run: |
          GOROOT=$(go env GOROOT)
          if   [ -f "$GOROOT/lib/wasm/wasm_exec.js" ];  then cp "$GOROOT/lib/wasm/wasm_exec.js" .
          elif [ -f "$GOROOT/misc/wasm/wasm_exec.js" ]; then cp "$GOROOT/misc/wasm/wasm_exec.js" .
          else echo "wasm_exec.js が見つかりません"; exit 1
          fi

      - name: Firebase 接続設定を生成
        # これらは秘密情報ではない（Web API キーは公開前提）。データの保護は
        # database.rules.json が行う。リポジトリ変数・シークレットどちらでも動く。
        env:
          API_KEY:     ${{ vars.FIREBASE_API_KEY     || secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          DB_URL:      ${{ vars.FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
          PROJECT_ID:  ${{ vars.FIREBASE_PROJECT_ID  || secrets.FIREBASE_PROJECT_ID }}
          BUCKET:      ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          SENDER_ID:   ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID:      ${{ vars.FIREBASE_APP_ID      || secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::FIREBASE_API_KEY と FIREBASE_DATABASE_URL を"
            echo "::error::リポジトリの Settings > Secrets and variables > Actions に設定してください。"
            exit 1
          fi
          cat > firebase-config.js <<EOF
          window.FIREBASE_CONFIG = {
            apiKey: "${API_KEY}",
            authDomain: "${AUTH_DOMAIN}",
            databaseURL: "${DB_URL}",
            projectId: "${PROJECT_ID}",
            storageBucket: "${BUCKET}",
            messagingSenderId: "${SENDER_ID}",
            appId: "${APP_ID}"
          };
          EOF

      - name: 配信物をまとめる
        # firebase.json の hosting.public が public/ を指している。
        run: |
          mkdir -p public
          cp index.html app.js sw.js main.wasm wasm_exec.js firebase-config.js public/
          # 画面が参照するものは全部入れる。ここから漏れると本番だけ壊れ、
          # ローカルでは動くので気づけない（実際に art/ が漏れていた）。
          cp -r art lib vendor public/
          [ -f tailwind.local.js ] && cp tailwind.local.js public/ || true
          # GitHub Pages の Jekyll 処理を無効化する（_ で始まる名前が消される）。
          touch public/.nojekyll
          ls -la public

      # 参照しているファイルが 1 つでも欠けていないか、配信物そのものを検査する。
      # 「ローカルでは動くのに本番だけ壊れる」を二度と起こさないための関門。
      # PR でもここまで走らせる（デプロイはしない）。
      - name: 配信物の参照チェック
        run: node tools/check-site.mjs public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 会場の端末の設定で *.github.io が開けないため、Render（静的サイト・無料）
      # にも同じものを出す。Render 側ではビルドを何もせず、この枝の中身を
      # そのまま配らせる（設定は render.yaml）。向こうに Go も Node も要らない
      # ので、ここを通った配信物がそのまま本番になる。
      #
      # 履歴は持たない。戻すときは main を直して出し直す（Pages と同じ）。
      - name: 配信物を render ブランチへ押す
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          # public/ の中身だけを移す。.nojekyll のようなドットファイルも含める。
          cp -a public/. "$work/"
          cd "$work"
          git init -q -b render
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main.wasm と firebase-config.js は main では .gitignore 済みだが、
          # ここは別のリポジトリとして作り直しているので無関係に入る。
          # どちらも公開前提のもの（API キーの扱いは README の「セキュリティ」）。
          git add -A
          git commit -qm "配信物 ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            render:render
          echo "### Render へ出しました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "render ブランチを更新しました。Render が自動で配り直します（1〜2 分）。" >> "$GITHUB_STEP_SUMMARY"

      # Render の GitHub 連携を入れていない場合の経路（Render と GitHub の
      # アカウントが別で、繋げられなかったときなど）。公開リポジトリを URL で
      # 繋いだサイトには Render 側が webhook を張れないため、push に自動では
      # 気づかない。そこを Render の Deploy Hook を叩いて埋める。
      #
      # secret RENDER_DEPLOY_HOOK が未設定なら何もしない。GitHub 連携を
      # 入れたなら Render が自分で気づくので、その場合は設定しないこと
      # （両方あると 1 回の push で 2 回配り直す）。
      - name: Render に配り直しを知らせる（Deploy Hook）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK は未設定。Render 側の GitHub 連携に任せます。"
            exit 0
          fi
          # ここが通らなくても配信物は render ブランチに入っている
          # （Render の画面から手で Deploy できる）。全体は落とさない。
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK" || echo 000)
          echo "Deploy Hook -> HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::warning::Render への通知が通りませんでした（HTTP $code）。Render の画面から手動 Deploy してください。"
          fi

  deploy:
    name: GitHub Pages へデプロイ
    # PR ではデプロイしない（ビルドとテストまで）。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # ルールは画面と一緒には出ない。database.rules.json を変えたら、
      # Firebase コンソールに人が貼る必要がある。貼り忘れると $other:false に
      # よって全書き込みが拒否される（過去 4 回これで止まっている）。
      # 画面側は rulesVersion を測って赤い帯を出すので、当日はそれで気づく。
      - name: ルールの貼り忘れを促す
        run: |
          echo "### 配信しました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "画面: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**database.rules.json を変えた場合は、Firebase コンソール →" >> "$GITHUB_STEP_SUMMARY"
          echo "Realtime Database → ルール に貼って公開してください。**" >> "$GITHUB_STEP_SUMMARY"
          echo "貼っていないと画面上部に赤い帯が出て、注文が 1 件も保存されません。" >> "$GITHUB_STEP_SUMMARY"
